<table cellpadding="0" cellspacing="0" width="100%" style="background-color:#f9fafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1a1a1a;">
  <tr>
    <td align="center" style="padding:24px 16px;">
      <table cellpadding="0" cellspacing="0" width="640" style="max-width:640px;">

        {# Main Card #}
        <tr>
          <td style="background:#ffffff;border-radius:8px;padding:32px 28px 24px;">

            {# Body #}
            {% if body %}
            <div style="color:#333333;padding:0 16px;">
              {{ body }}
            </div>
            {% endif %}

            {# Action Buttons #}
            {% if has_actions and not is_comment %}
            <div style="margin-top:24px;text-align:center;">
              {% for action in actions %}
              <a href="{{ action.url or open_link }}"
                 target="_blank"
                 style="display:inline-block;padding:10px 28px;border-radius:6px;font-size:14px;font-weight:600;text-decoration:none;margin:4px;
                 {% if action.primary %}background:#171717;color:#ffffff;{% else %}background:#e8ecf0;color:#171717;{% endif %}">
                {{ action.label }}
              </a>
              {% endfor %}
            </div>
            {% endif %}

            {# Open in ERPNext link #}
            {% if open_link %}
            <div style="margin-top:24px;padding-top:16px;border-top:1px solid #e1e4e8;text-align:center;">
              <a href="{{ open_link }}" target="_blank"
                 style="color:#171717;font-size:14px;font-weight:500;text-decoration:none;">
                Open in ERPNext →
              </a>
            </div>
            {% endif %}

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
