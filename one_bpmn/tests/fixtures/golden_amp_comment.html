<!doctype html>
<html ⚡4email data-css-strict>
<head>
  <meta charset="utf-8">
  <script async src="https://cdn.ampproject.org/v0.js"></script>
  
  <script async custom-element="amp-form" src="https://cdn.ampproject.org/v0/amp-form-0.1.js"></script>
  <script async custom-template="amp-mustache" src="https://cdn.ampproject.org/v0/amp-mustache-0.2.js"></script>
  
  <style amp-custom>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: #1a1a1a;
      background-color: #f5f5f5;
    }
    .email-wrapper {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .email-card {
      background: #ffffff;
      border-radius: 8px;
      padding: 32px 28px;
    }
    .email-subject {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px;
      color: #0d0d0d;
    }
    .email-body {
      color: #333333;
    }
    .email-body p {
      margin: 0 0 12px;
    }
    .email-body a {
      color: #516ac4;
      text-decoration: none;
    }
    .email-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    .email-body th,
    .email-body td {
      border: 1px solid #dfe2e5;
      padding: 8px 12px;
      text-align: left;
    }
    .email-body th {
      background: #f6f8fa;
      font-weight: 600;
    }
    .email-body amp-img {
      max-width: 100%;
    }
    .email-body blockquote {
      margin: 12px 0;
      padding: 8px 16px;
      border-left: 4px solid #dfe2e5;
      color: #555;
    }
    .email-body ul,
    .email-body ol {
      padding-left: 24px;
      margin: 0 0 12px;
    }
    .email-body li {
      margin-bottom: 4px;
    }
    .email-body pre {
      background: #f6f8fa;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 13px;
    }
    .email-body code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }
    .email-body hr {
      border: none;
      border-top: 1px solid #e1e4e8;
      margin: 16px 0;
    }
    .actions {
      margin-top: 24px;
    }
    .action-form {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #516ac4;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e8ecf4;
      color: #516ac4;
    }
    .comment-section {
      margin-top: 24px;
      border-top: 1px solid #e1e4e8;
      padding-top: 20px;
    }
    .comment-label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
    }
    .comment-textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
    }
    .comment-submit {
      margin-top: 10px;
    }
    .email-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e1e4e8;
      text-align: center;
    }
    .open-link {
      color: #516ac4;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .submit-success {
      color: #22863a;
      font-size: 14px;
      margin-top: 8px;
    }
    .submit-error {
      color: #cb2431;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
  <style amp4email-boilerplate>body{visibility:hidden}</style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-card">
      
      
      <h1 class="email-subject">New Comment on Task</h1>
      

      
      
      <div class="email-body">
        <p>Kartik posted a comment on your task.</p>
      </div>
      

      
      

      
      
      <div class="comment-section">
        <form method="post"
              action-xhr="https://erp.one-fm.com/api/method/one_bpmn.api.comment.submit_comment">
          <label class="comment-label" for="comment-input">Add a Comment</label>
          <textarea id="comment-input"
                    class="comment-textarea"
                    name="comment"
                    placeholder="Write your comment here…"
                    required></textarea>
          <input type="hidden" name="doctype" value="ToDo">
          <input type="hidden" name="name" value="TODO-001">
          <button type="submit" class="btn btn-primary comment-submit">
            Submit Comment
          </button>
          <div submit-success>
            <template type="amp-mustache">
              <p class="submit-success">✓ Comment submitted.</p>
            </template>
          </div>
          <div submit-error>
            <template type="amp-mustache">
              <p class="submit-error">⚠ Could not submit comment. Please try in ERPNext.</p>
            </template>
          </div>
        </form>
      </div>
      

      
      
      <div class="email-footer">
        <a href="https://erp.one-fm.com/app/todo/TODO-001" class="open-link" target="_blank">
          Open in ERPNext →
        </a>
      </div>
      
    </div>
  </div>
</body>
</html>
