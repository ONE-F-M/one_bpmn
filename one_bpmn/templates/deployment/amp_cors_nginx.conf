# AMP Email CORS - nginx preflight handler
#
# Include this inside the site's `server {}` block in config/nginx.conf
# (bench setup nginx regenerates that file, so re-add the include after
# running it). Answers the OPTIONS preflight at the proxy layer and hands
# POST to the bench-generated `@webserver` named location, so no upstream
# name or proxy_set_header list is duplicated here.
#
# The POST response headers (Access-Control-Allow-Origin, the AMP-* echo
# headers) come from Frappe itself: `allow_cors` in site_config.json must
# include https://mail.google.com (and https://amp.gmail.dev for the
# Playground), and one_bpmn.api.todo_actions._set_amp_cors_headers sets
# the AMP-specific ones.
#
# Usage, inside `server { ... }` before `location / {`:
#   include /etc/nginx/snippets/amp_cors.conf;

location = /api/method/one_bpmn.api.todo_actions.handle_amp_action {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, AMP-Same-Origin, AMP-Email-Sender' always;
        add_header 'Access-Control-Expose-Headers' 'AMP-Access-Control-Allow-Source-Origin, AMP-Email-Allow-Sender' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Length' 0;
        return 204;
    }
    try_files /dev/null @webserver;
}

# Same for the plain-Frappe-Workflow AMP action endpoint (e.g. the Work
# Item "Start Work" button) - see one_bpmn.api.workflow_actions.
location = /api/method/one_bpmn.api.workflow_actions.handle_workflow_action {
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, AMP-Same-Origin, AMP-Email-Sender' always;
        add_header 'Access-Control-Expose-Headers' 'AMP-Access-Control-Allow-Source-Origin, AMP-Email-Allow-Sender' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Length' 0;
        return 204;
    }
    try_files /dev/null @webserver;
}
