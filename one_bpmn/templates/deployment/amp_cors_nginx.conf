# AMP Email CORS — Nginx preflight handler
#
# Add this inside the server {} block for the site that hosts one_bpmn.
# It handles the OPTIONS preflight at the proxy layer (faster than
# hitting gunicorn/Python).  POST requests pass through to Frappe
# where the Python endpoint sets its own CORS headers.
#
# NOTE: this only speeds up the OPTIONS preflight. The actual POST
# response's Access-Control-Allow-Origin header (required regardless of
# this file) comes from Frappe itself, and depends on the site's
# `allow_cors` config including https://mail.google.com (and
# https://amp.gmail.dev for Playground testing) — see
# frappe.app.set_cors_headers(). Missing that site config is a common
# cause of "blocked by AMP CORS policy" errors even with this file
# correctly deployed.
#
# Usage:
#   include /path/to/amp_cors_nginx.conf;

location = /api/method/one_bpmn.api.todo_actions.handle_amp_action {

    # Handle OPTIONS preflight at the proxy layer
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, AMP-Same-Origin' always;
        add_header 'Access-Control-Expose-Headers' 'AMP-Access-Control-Allow-Source-Origin' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Length' 0;
        return 204;
    }

    # POST requests → pass to Frappe backend
    proxy_pass http://frappe-bench;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Same preflight handling for the generic plain-Frappe-Workflow AMP
# action endpoint (e.g. the Work Item "Start Work" button) — see
# one_bpmn.api.workflow_actions.handle_workflow_action.
location = /api/method/one_bpmn.api.workflow_actions.handle_workflow_action {

    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, AMP-Same-Origin' always;
        add_header 'Access-Control-Expose-Headers' 'AMP-Access-Control-Allow-Source-Origin' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Length' 0;
        return 204;
    }

    proxy_pass http://frappe-bench;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
