name: Deploy CI/CD to Staging site

on:
  workflow_dispatch:
  push: # tells github to run this on any push to the repository
    branches:
      - staging

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Deploy to Staging site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.STAGING_KEY }}
          port: 22
          script: |
            set -e
            export PATH="/home/frappe/.local/bin:$PATH"
            command -v bench
            bench --version
            
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            node -v
            cd /home/frappe/frappe-bench/apps/one_bpmn
            git pull upstream staging
            cd /home/frappe/frappe-bench
            rm -rf env/lib/python*/site-packages/one_bpmn-*.dist-info
            bench setup requirements one_bpmn
            cd /home/frappe/frappe-bench/apps/one_bpmn/spiff
            yarn install
            export NODE_OPTIONS="--max-old-space-size=8192"
            yarn build
            cd /home/frappe/frappe-bench
            bench --site staging.one-fm.com migrate
            bench --site staging.one-fm.com build --app one_bpmn
            bench --site staging.one-fm.com clear-cache
            bench restart
