name: Deploy CI/CD to BA site

on:
  workflow_dispatch:
  push: # tells github to run this on any push to the repository
    branches:
      - staging

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Deploy to BA site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BA_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.BA_KEY }}
          port: 22
          script: |
            cd /home/frappe/sandbox-bench/apps/one_bpmn # we move into our app's folder
            git pull upstream staging
            cd /home/frappe/sandbox-bench
            bench setup requirements one_bpmn
            bench migrate --skip-failing
            bench build --app one_bpmn
            bench clear-cache
            bench restart
