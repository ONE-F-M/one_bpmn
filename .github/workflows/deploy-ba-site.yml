name: Deploy CI/CD to BA site

on:
  workflow_dispatch:
  push: # tells github to run this on any push to the repository
    branches:
      - staging

concurrency:
  group: deploy-ba-site
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Deploy to BA site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BA_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.BA_KEY }}
          port: 22
          command_timeout: 60m
          script: |
            set -eo pipefail
            export PATH="/home/frappe/.local/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            command -v bench
            bench --version
            node -v

            BENCH=/home/frappe/sandbox-bench
            WORKERS="$(basename "$BENCH")-workers:"
            # One deploy at a time per bench, across one_fm, one_bpmn and frappe_agile.
            exec 9>"$BENCH/config/deploy.lock"
            flock -w 1500 9

            cd $BENCH/apps/one_bpmn
            git pull upstream staging
            cd $BENCH
            rm -rf env/lib/python*/site-packages/one_bpmn-*.dist-info
            bench setup requirements one_bpmn
            cd $BENCH/apps/one_bpmn/spiff
            yarn install
            export NODE_OPTIONS="--max-old-space-size=8192"
            yarn build
            cd $BENCH

            trap 'status=$?; if [ $status -ne 0 ]; then sudo supervisorctl start "$WORKERS"; fi' EXIT
            # Workers and the scheduler write Scheduled Job Log while migrate deletes from it.
            sudo supervisorctl stop "$WORKERS"
            # A scheduler orphaned by an earlier stop holds the lock supervisor's scheduler needs; [s] keeps pkill off this script.
            pkill -f "$BENCH/env/bin/python -m frappe.utils.bench_helper frappe [s]chedule" || true
            bench --site business-analyst.one-fm.com migrate
            bench --site business-analyst.one-fm.com build --app one_bpmn
            bench --site business-analyst.one-fm.com clear-cache
            bench restart

      - name: Check agent tools on BA site
        uses: appleboy/ssh-action@master
        env:
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_AGENT_TOOLS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          host: ${{ secrets.BA_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.BA_KEY }}
          port: 22
          envs: GCHAT_WEBHOOK,RUN_URL
          script: |
            export PATH="/home/frappe/.local/bin:$PATH"
            cd /home/frappe/sandbox-bench
            bench --site business-analyst.one-fm.com check-agent-tools > /tmp/check-agent-tools.log 2>&1
            status=$?
            cat /tmp/check-agent-tools.log
            if [ $status -ne 0 ]; then
              python3 -c 'import json, os, urllib.request; log = open("/tmp/check-agent-tools.log").read()[-3500:]; body = json.dumps({"text": "*check-agent-tools failed on BA site*\n```" + log + "```\n" + os.environ["RUN_URL"]}).encode(); urllib.request.urlopen(urllib.request.Request(os.environ["GCHAT_WEBHOOK"], body, {"Content-Type": "application/json; charset=UTF-8"}), timeout=20)'
              exit $status
            fi
